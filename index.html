<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World</title>
  <style>
    :root {
      --bg: #f5f7fa;
      --fg: #1f2933;
      --accent: #2563eb;
      --card: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111827;
        --fg: #e5e7eb;
        --accent: #60a5fa;
        --card: #1f2937;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--fg);
    }
    main {
      background: var(--card);
      padding: 2rem 2.5rem;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      text-align: center;
      max-width: 420px;
      width: 100%;
    }
    h1 { margin-top: 0; color: var(--accent); }
    button {
      font: inherit;
      padding: 0.6rem 1.2rem;
      border: none;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
    }
    button:hover { opacity: 0.9; }
    #count { font-weight: bold; }
    small { display: block; margin-top: 1.5rem; opacity: 0.6; }
  </style>
</head>
<body>
  <main>
    <h1>Hello World!</h1>
    <p>Diese Seite läuft auf GitHub Pages.</p>
    <button id="btn" type="button">Klick mich</button>
    <p>Klicks: <span id="count">0</span></p>
    <small>Geladen am <span id="time"></span></small>
  </main>
  <script>
    let count = 0;
    document.getElementById('btn').addEventListener('click', () => {
      document.getElementById('count').textContent = ++count;
    });
    document.getElementById('time').textContent = new Date().toLocaleString('de-DE');
  </script>
</body>
</html>
